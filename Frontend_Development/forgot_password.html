<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Forgot Password | Result Analysis</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-wrap">
        <div class="card">
            <div class="center">
                <div class="hero">
                    <div class="icon">🔑</div>
                    <h1>Forgot Password</h1>
                    <p>Reset your password securely</p>
                </div>
            </div>
            <!-- Step 1: Identify -->
            <div id="step1">
                <div class="field"><label for="fpUserId">User ID / USN</label><input id="fpUserId" placeholder="Enter your User ID or USN"></div>
                <p id="fpMsg1" class="message"></p><button class="btn" id="fpSendOtpBtn" style="width:100%">Send OTP</button>
            </div>
            <!-- Step 2: Verify OTP -->
            <div id="step2" class="hidden">
                <p class="muted" id="fpContactInfo" style="margin:8px 0; font-size:13px;"></p>
                <div class="field"><label for="fpOtp">Enter OTP</label><input id="fpOtp" maxlength="6" placeholder="6-digit OTP"></div>
                <p id="fpMsg2" class="message"></p><button class="btn" id="fpVerifyBtn" style="width:100%">Verify OTP</button>
            </div>
            <!-- Step 3: New Password -->
            <div id="step3" class="hidden">
                <div class="field"><label for="fpNewPwd">New Password</label><input id="fpNewPwd" type="password" placeholder="Enter new password"></div>
                <div class="field" style="margin-top:10px;"><label for="fpConfirmPwd">Confirm New Password</label><input id="fpConfirmPwd" type="password" placeholder="Confirm new password"></div>
                <p id="fpMsg3" class="message"></p><button class="btn" id="fpResetBtn" style="width:100%">Reset Password</button>
            </div>
            <p class="center muted" style="margin-top:14px;"><button class="link-btn" id="backToLoginBtn" type="button">Back to Login</button></p>
        </div>
        <div class="footer">© 2026 Student Result Analysis System</div>
    </div>
    <script src="config.js"></script>
    <script>
        const API_BASE = window.APP_CONFIG?.API_BASE_URL || "http://localhost:8081";
        const $ = id => document.getElementById(id);
        let currentUserId = null;
        $('backToLoginBtn').addEventListener('click', ()=> location.href='index.html');
        $('fpSendOtpBtn').addEventListener('click', async ()=>{
            const userId = $('fpUserId').value.trim();
            const msg=$('fpMsg1');
            msg.textContent=''; msg.style.color='#dc2626';
            if(!userId){ msg.textContent='Enter your User ID'; return; }
            $('fpSendOtpBtn').disabled=true; $('fpSendOtpBtn').textContent='Sending...';
            try{
                const r=await fetch(`${API_BASE}/api/auth/forgot-password/request`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId})});
                const d=await r.json();
                if(!r.ok) throw new Error(d.message||'Failed');
                currentUserId=userId;
                $('fpContactInfo').textContent=d.maskedContact?`OTP sent to ${d.maskedContact}`:d.message;
                $('step1').classList.add('hidden');
                $('step2').classList.remove('hidden');
                msg.textContent='';
            }catch(e){ msg.textContent=e.message||'Failed'; }
            finally{ $('fpSendOtpBtn').disabled=false; $('fpSendOtpBtn').textContent='Send OTP'; }
        });
        $('fpVerifyBtn').addEventListener('click', async ()=>{
            const otp=$('fpOtp').value.trim();
            const msg=$('fpMsg2');
            msg.textContent=''; msg.style.color='#dc2626';
            if(!otp){ msg.textContent='Enter OTP'; return; }
            $('fpVerifyBtn').disabled=true; $('fpVerifyBtn').textContent='Verifying...';
            try{
                const r=await fetch(`${API_BASE}/api/auth/forgot-password/verify`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:currentUserId, otp})});
                const d=await r.json();
                if(!r.ok) throw new Error(d.message||'Invalid OTP');
                $('step2').classList.add('hidden');
                $('step3').classList.remove('hidden');
            }catch(e){ msg.textContent=e.message||'Failed'; }
            finally{ $('fpVerifyBtn').disabled=false; $('fpVerifyBtn').textContent='Verify OTP'; }
        });
        $('fpResetBtn').addEventListener('click', async ()=>{
            const np=$('fpNewPwd').value;
            const cp=$('fpConfirmPwd').value;
            const msg=$('fpMsg3');
            msg.textContent=''; msg.style.color='#dc2626';
            if(!np||!cp){ msg.textContent='All fields required'; return; }
            $('fpResetBtn').disabled=true; $('fpResetBtn').textContent='Resetting...';
            try{
                const r=await fetch(`${API_BASE}/api/auth/forgot-password/reset`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:currentUserId, newPassword:np, confirmPassword:cp})});
                const d=await r.json();
                if(!r.ok) throw new Error(d.message||'Failed');
                msg.textContent=d.message||'Password reset successful'; msg.style.color='#15803d';
                setTimeout(()=> location.href='index.html', 1200);
            }catch(e){ msg.textContent=e.message||'Failed'; }
            finally{ $('fpResetBtn').disabled=false; $('fpResetBtn').textContent='Reset Password'; }
        });
    </script>
</body>
</html>
